name: deploy

# Builds the site and deploys the Cloudflare Worker (wrangler.jsonc: dist/ as static assets plus worker/ for /api/*).
# Runs when release-please.yml creates a release, or by hand (Actions → deploy → Run workflow).
# Needs the repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID;
# the VITE_UMAMI_ID / VITE_UMAMI_SRC repository variables are optional.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_UMAMI_ID: ${{ vars.VITE_UMAMI_ID }}
          VITE_UMAMI_SRC: ${{ vars.VITE_UMAMI_SRC }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
